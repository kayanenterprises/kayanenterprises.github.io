<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Kayan Enterprises</title>
    <link rel="icon" type="image/jpeg" href="/media/icon.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 id="t" style="color: var(--primary); margin: 20px 0;">Page not found</h1>
        <p id="p" style="color: var(--text-light); margin-bottom: 30px;">The page you are looking for doesn't exist or has moved.</p>
        <a href="/" class="btn" id="b">Back to home</a>
    </div>
    <script src="/i18n.js"></script>
    <script>
        try {
            const l = localStorage.getItem("kayan_lang");
            if (l && TRANSLATIONS[l]) {
                document.documentElement.lang = l;
                t.textContent = TRANSLATIONS[l]["e404.title"];
                p.textContent = TRANSLATIONS[l]["e404.p"];
                b.textContent = TRANSLATIONS[l]["e404.btn"];
            }
        } catch (e) {}
    </script>
</body>
</html>
